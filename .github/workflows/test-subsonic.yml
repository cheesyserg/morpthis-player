name: Subsonic streaming tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test-subsonic.yml
      - morpthis-player/src/system/**
      - morpthis-player/src/gui/streaming/subsonicpage.*
      - morpthis-player/tests/**
  push:
    paths:
      - .github/workflows/test-subsonic.yml
      - morpthis-player/src/system/**
      - morpthis-player/src/gui/streaming/subsonicpage.*
      - morpthis-player/tests/**

permissions:
  contents: read

concurrency:
  group: subsonic-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config libopusfile-dev libwavpack-dev
      - name: HTTP, REST, buffering, playlist and ownership
        run: make -C morpthis-player/tests test
      - name: Real MP3, FLAC and Opus stream decoding
        run: make -C morpthis-player/tests codecs
      - name: Address and undefined-behavior sanitizers
        run: |
          make -C morpthis-player/tests sanitize
          make -C morpthis-player/tests sanitize-codecs
