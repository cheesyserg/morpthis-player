name: Build TempoTec V1 firmware

on:
  workflow_dispatch:
    inputs:
      stock_firmware_url:
        description: Official TempoTec firmware URL (Drive folder, Drive file, archive, or raw v1.upt)
        required: true
        type: string
        default: https://drive.google.com/drive/folders/1jbT9lhRvJ8sbJuepnaBpss861mpsYwnv?usp=sharing
      acknowledge_community_build:
        description: I understand this is an unofficial community build and will keep the matching official firmware and checksum for recovery
        required: true
        type: boolean
        default: false
      # What to build, and what to do with it, said out loud. A run's artifact
      # is named after the commit it was built from, but which commit that is
      # has always been the ref the run was started on -- so a release cut from
      # "the newest artifact" could be an image of a branch that predates a
      # merge, which is exactly how the 1.3.1.1 image came to be missing the
      # Immersive work its own tag carried. These two inputs make the answer a
      # decision rather than a guess: build this ref, and if it is a release's
      # own commit, put it on that release.
      build_ref:
        description: Ref to build (branch, tag or commit). Empty builds the ref this was dispatched from.
        required: false
        type: string
      sdk_ref:
        description: Ref of morpthis-sdk to build against (branch, tag or commit). Empty uses main.
        required: false
        type: string
      publish_release_tag:
        description: Release tag to upload the built image to, replacing its assets (v1.upt, v1_md5.txt). Empty publishes nothing.
        required: false
        type: string
      # The way out when a cache is what is wrong. Every restore step checks
      # this input, so nothing is reused: the toolchain, the static libraries,
      # the compiler objects and the stock download are all built or fetched
      # again. What the run produces is saved under a run-specific key (see
      # CACHE_SUFFIX). Delete the suspect entries from the repository's Caches
      # page if they should be replaced for good: a later run whose own key
      # matches one of them keeps restoring it.
      fresh_build:
        description: Ignore every cache and rebuild from scratch (toolchain, libraries, objects and stock download)
        required: false
        type: boolean
        default: false
      # The middle ground: what a cache reset is for, minus the compiler. The
      # toolchain keeps its cache, so the 20-35 minute rebuild does not happen;
      # the stock download, the static libraries and the compiler objects are
      # all fetched or built again. Ignored when fresh_build is set, which
      # already drops every cache.
      fresh_keep_toolchain:
        description: Ignore every cache except the MIPS toolchain (re-download the stock image, rebuild libraries and objects)
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/build-tempotec-v1.yml
      - morpthis-packer/**
      - morpthis-player/Makefile
      - morpthis-player/rockboxdev/**
      - morpthis-player/src/**
  # Working branches build themselves: the image is the only way to try a
  # layout change on the device, and a dispatch needs a token that can write
  # to Actions. No path filter here on purpose - a session branch has to be
  # able to produce an image on request, not only when a build input changed.
  #
  # main builds too, and tags build: a merge is a tree nobody has built yet,
  # and it is the tree a release is cut from. What this cannot fix -- a
  # release taken from whichever artifact happens to be newest -- it makes
  # visible instead: the artifact is named after the commit it really holds
  # (see "Record the revision being built"), so an image can be checked
  # against the tag it claims to be before anybody flashes it.
  push:
    branches:
      - main
      - arena/**
    tags:
      - '*'

permissions:
  # write: the last step publishes the boot-script report back to the
  # working branch, [skip ci] and all, so the next build never flies blind.
  contents: write

concurrency:
  group: tempotec-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STOCK_FIRMWARE_URL: ${{ inputs.stock_firmware_url || 'https://drive.google.com/drive/folders/1jbT9lhRvJ8sbJuepnaBpss861mpsYwnv?usp=sharing' }}
  # The app API headers. The player implements the SDK; the checkout below puts
  # the sibling repository inside the workspace and this is its absolute path.
  MORPTHIS_SDK: ${{ github.workspace }}/morpthis-sdk
  # The packages this job needs, split by when they are needed. The second list
  # is consumed only by a toolchain build, which happens only on a cache miss,
  # so a normal run installs nothing from it. Both are named here so the
  # dependency cache key and the install step cannot disagree.
  TOOL_PACKAGES: >-
    build-essential git pkg-config wget curl ca-certificates
    patch xz-utils bzip2 gzip
    p7zip-full squashfs-tools genisoimage
    python3 python3-venv ccache
  TOOLCHAIN_PACKAGES: >-
    texinfo bison flex gawk gperf autoconf automake libtool libtool-bin
    libgmp-dev libmpfr-dev libmpc-dev
  # ccache for the target compile, restored and saved around the build. The
  # directory sits in the workspace so the cache steps can name it without a
  # step-local variable; .gitignore keeps it out of the tree.
  #
  # COMPILERCHECK=content is required: the cross compiler itself comes from an
  # Actions cache, and its mtime differs between restores. The default check
  # hashes that mtime, which would turn every lookup into a miss.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 750M
  CCACHE_COMPRESS: 'true'
  # Empty on a normal run, so every cache key stays exactly what it was. Either
  # reset input appends the run id: the affected restore steps are skipped and
  # what the run produces is saved under a key of its own instead of colliding
  # with an entry that already exists.
  CACHE_SUFFIX: ${{ (inputs.fresh_build || inputs.fresh_keep_toolchain) && format('-fresh-{0}', github.run_id) || '' }}
  # Only a full fresh build skips the toolchain, so only that input puts a
  # suffix on its key. fresh_keep_toolchain restores the compiler under its
  # normal key, so an exact hit costs nothing and a partial one still refreshes
  # the entry after a miss.
  TOOLCHAIN_CACHE_SUFFIX: ${{ inputs.fresh_build && format('-fresh-{0}', github.run_id) || '' }}

jobs:
  firmware:
    name: Cross-compile and package v1.upt
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Require firmware-build acknowledgement
        if: github.event_name == 'workflow_dispatch' && inputs.acknowledge_community_build != true
        run: |
          echo 'This workflow creates an unofficial TempoTec V1 firmware image.' >&2
          echo 'Keep the matching official stock firmware and checksum available for recovery.' >&2
          echo 'Run it again and select the acknowledgement checkbox.' >&2
          exit 1

      - name: Check out source
        uses: actions/checkout@v5
        with:
          # The ref asked for, when one was: a run started on a working branch
          # with build_ref set to a tag builds the tag, not the branch. Left
          # empty, this is the run's own ref, as it always was.
          ref: ${{ inputs.build_ref || github.sha }}

      - name: Check out the app SDK
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/morpthis-sdk
          ref: ${{ inputs.sdk_ref || 'main' }}
          path: morpthis-sdk

      # The one line every later step and every report reads. GITHUB_SHA is
      # the ref the run was STARTED on, which is not the ref that was built
      # once build_ref is in play; the checkout is the truth, so the artifact
      # name, the build report and the release upload all take it from here.
      - name: Record the revision being built
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s)"
          sdk_sha="$(git -C morpthis-sdk rev-parse HEAD)"
          sdk_subject="$(git -C morpthis-sdk log -1 --format=%s)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sdk_sha=$sdk_sha" >> "$GITHUB_OUTPUT"
          echo "Building $sha"
          echo "  $subject"
          echo "SDK $sdk_sha"
          echo "  $sdk_subject"
          {
            echo "### Built revision"
            echo '```'
            echo "player  $sha  $subject"
            echo "sdk     $sdk_sha  $sdk_subject"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Restored before anything can use the compiler, so the install step below
      # can tell whether the toolchain build dependencies are needed at all.
      #
      # The toolchain is cached apart from the libraries it was once bundled
      # with. It is the expensive part (binutils, GCC and glibc take 20-35
      # minutes), it changes only when rockboxdev does, and fresh_keep_toolchain
      # has to be able to keep it while dropping everything else.
      - name: Restore the MIPS toolchain
        id: toolchain-cache
        if: inputs.fresh_build != true
        uses: actions/cache/restore@v5
        with:
          path: morpthis-player/rockbox-toolchain
          # The directory name is part of the key on purpose. The cross
          # compiler is configured with --with-sysroot pointing at an absolute
          # path inside this tree, so a cache written for another directory
          # name cannot be used from here.
          key: v3-mips-toolchain-${{ runner.os }}-${{ hashFiles('morpthis-player/rockboxdev/**') }}${{ env.TOOLCHAIN_CACHE_SUFFIX }}
          restore-keys: |
            v3-mips-toolchain-${{ runner.os }}-

      # The compiler answers for itself. One restored under another directory
      # name finds no sysroot and would fail the build in a way that looks like
      # a compiler problem, so it is checked before anything uses it.
      - name: Check the restored toolchain
        id: toolchain-check
        if: inputs.fresh_build != true
        run: |
          set -euo pipefail
          gcc="morpthis-player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc"
          usable=false
          if [ -x "$gcc" ]; then
            sysroot="$("$gcc" -print-sysroot 2>/dev/null || true)"
            case "$sysroot" in
              "$GITHUB_WORKSPACE"/*) usable=true ;;
              *)
                echo "::warning::The cached toolchain expects ${sysroot:-an unknown sysroot}; discarding it."
                rm -rf morpthis-player/rockbox-toolchain
                ;;
            esac
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"

      # The Makefile clones LVGL (a 100 MB tree) while it is being parsed, every
      # run. Caching the checkout skips that download; the Makefile's own version
      # check still runs and rejects a tree that is not the pinned tag.
      - name: Read the pinned LVGL version
        id: lvgl-version
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^LVGL_VER *= *//p' morpthis-player/Makefile | head -n 1)"
          test -n "$ver"
          echo "value=$ver" >> "$GITHUB_OUTPUT"
          echo "LVGL $ver"

      - name: Restore the LVGL checkout
        id: lvgl-checkout
        if: inputs.fresh_build != true && inputs.fresh_keep_toolchain != true
        uses: actions/cache/restore@v5
        with:
          path: morpthis-player/lvgl
          key: lvgl-src-${{ runner.os }}-${{ steps.lvgl-version.outputs.value }}

      # The image is provisioned, so this usually finds nothing to do. When it
      # does, the list and the cache key below come from TOOL_PACKAGES, plus
      # TOOLCHAIN_PACKAGES when no usable compiler came back.
      - name: Find missing build tools
        id: tools
        env:
          TOOLCHAIN_USABLE: ${{ steps.toolchain-check.outputs.usable }}
        run: |
          set -euo pipefail
          packages="$TOOL_PACKAGES"
          if [ "$TOOLCHAIN_USABLE" != "true" ]; then
            packages="$packages $TOOLCHAIN_PACKAGES"
          fi
          missing=""
          for package in $packages; do
            status="$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)"
            case "$status" in
              *"install ok installed"*) ;;
              *) missing="$missing $package" ;;
            esac
          done
          if [ -z "$missing" ]; then
            echo "All build and firmware tools are already on the runner image."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing:$missing"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      # apt's package lists and the .deb files it downloads, kept together so a
      # run that has to install anything never goes to the network for them.
      # The image name and version are part of the key because the lists only
      # describe the image they were fetched on; a new image is a new key.
      - name: Compute the dependency cache key
        id: apt-key
        if: steps.tools.outputs.needed == 'true'
        run: |
          set -euo pipefail
          digest="$(printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "$TOOL_PACKAGES" "$TOOLCHAIN_PACKAGES" \
            | sha256sum | cut -c1-16)"
          echo "key=apt-${{ runner.os }}-${{ runner.arch }}-$digest" >> "$GITHUB_OUTPUT"
          echo "Dependency cache key: apt-${{ runner.os }}-${{ runner.arch }}-$digest"

      - name: Restore the dependency cache
        id: apt-cache
        if: steps.tools.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/apt/lists
            ${{ runner.temp }}/apt/archives
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install build and firmware tools
        id: apt-install
        if: steps.tools.outputs.needed == 'true'
        env:
          MISSING: ${{ steps.tools.outputs.missing }}
        run: |
          set -euo pipefail
          echo "Installing:$MISSING"

          # apt downloads as the _apt user, so both directories have to be
          # writable by it, whether they were just created or restored. They
          # are handed back to the runner at the end so the save step can read
          # them.
          lists="$RUNNER_TEMP/apt/lists"
          archives="$RUNNER_TEMP/apt/archives"
          mkdir -p "$lists/partial" "$archives/partial"
          sudo chown -R _apt:root "$lists" "$archives"
          apt_opts=(-o "Dir::State::lists=$lists"
                    -o "Dir::Cache::archives=$archives"
                    -o "APT::Keep-Downloaded-Packages=true")

          # A restored lists directory means the index is already there. The
          # update is the slow half of apt and there is nothing left to fetch
          # for it.
          if ! find "$lists" -maxdepth 1 -name '*_Packages*' -print -quit 2>/dev/null \
              | grep -q .; then
            sudo apt-get "${apt_opts[@]}" update
          fi
          if ! sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends $MISSING; then
            # A cached list can name a version the archive no longer carries.
            # Refreshing costs one update; failing the job costs the run.
            echo "::warning::Installing from the cached package lists failed; refreshing them."
            sudo apt-get "${apt_opts[@]}" update
            sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends $MISSING
          fi

          # The lock files are root-only and useless to the next run.
          sudo rm -f "$lists/lock" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$lists" "$archives"
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Save the dependency cache
        if: steps.apt-install.outputs.installed == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/apt/lists
            ${{ runner.temp }}/apt/archives
          key: ${{ steps.apt-key.outputs.key }}

      # The stock image is the same file from run to run, and it is the slowest
      # network dependency here. The URL is what identifies it, so the download
      # directory is cached under a hash of the URL and fetched once. Actions
      # caches cannot be overwritten: if the folder behind the URL is replaced,
      # delete the entry (or point stock_firmware_url at the new file) to fetch
      # it again.
      - name: Compute the stock-firmware cache key
        id: stock-key
        run: |
          set -euo pipefail
          digest="$(printf '%s' "$STOCK_FIRMWARE_URL" | sha256sum | cut -c1-16)"
          echo "url_hash=$digest" >> "$GITHUB_OUTPUT"
          echo "Firmware URL hash: $digest"

      - name: Restore the official firmware download
        id: stock-cache
        # Either reset re-downloads even when the entry is there. The key stays
        # the same, so its save step below is a no-op when it already exists.
        if: inputs.fresh_build != true && inputs.fresh_keep_toolchain != true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/v1-stock-download
          key: v1-stock-${{ runner.os }}-${{ steps.stock-key.outputs.url_hash }}

      # Only on a miss. gdown lives in a throwaway venv, which is not worth
      # installing when the download is already there.
      - name: Download official TempoTec V1 firmware
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-stock-download"
          case "$STOCK_FIRMWARE_URL" in
            *drive.google.com*)
              python3 -m venv "$RUNNER_TEMP/gdown-venv"
              "$RUNNER_TEMP/gdown-venv/bin/pip" install --disable-pip-version-check gdown
              ;;
          esac
          case "$STOCK_FIRMWARE_URL" in
            *drive.google.com/drive/folders/*)
              "$RUNNER_TEMP/gdown-venv/bin/gdown" --folder "$STOCK_FIRMWARE_URL" \
                -O "$RUNNER_TEMP/v1-stock-download"
              ;;
            *drive.google.com/*)
              "$RUNNER_TEMP/gdown-venv/bin/gdown" --fuzzy "$STOCK_FIRMWARE_URL" \
                -O "$RUNNER_TEMP/v1-stock-download/download"
              ;;
            *)
              curl --fail --location --retry 5 --retry-all-errors \
                "$STOCK_FIRMWARE_URL" -o "$RUNNER_TEMP/v1-stock-download/download"
              ;;
          esac

      - name: Show the firmware download
        run: find "$RUNNER_TEMP/v1-stock-download" -type f -printf '%P  %s bytes\n'

      - name: Prepare and validate stock image
        id: stock
        run: |
          set -euo pipefail
          chmod +x morpthis-packer/*.sh
          morpthis-packer/prepare_v1_stock.sh \
            "$RUNNER_TEMP/v1-stock-download" morpthis-packer
          morpthis-packer/verify_upt.sh morpthis-packer/v1_original.upt \
            | tee "$RUNNER_TEMP/v1-stock-validation.txt"
          kernel_sha256="$(sed -n 's/^Kernel SHA-256: //p' "$RUNNER_TEMP/v1-stock-validation.txt")"
          test -n "$kernel_sha256"
          echo "kernel_sha256=$kernel_sha256" >> "$GITHUB_OUTPUT"

      # Saved only after prepare_v1_stock.sh and verify_upt.sh accepted the
      # download, so a wrong or corrupt file is not what the next run restores.
      # Another run may have written the same key first; that is not a failure.
      - name: Save the official firmware download
        if: steps.stock-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/v1-stock-download
          key: v1-stock-${{ runner.os }}-${{ steps.stock-key.outputs.url_hash }}

      # Before this cache was split, the toolchain and the libraries lived in
      # one entry, which has a different path list and therefore a different
      # cache version: the split restore above cannot see it. This picks it up
      # once, when no toolchain came back, so the split itself costs no rebuild.
      # It restores the old libraries along with the compiler; after that first
      # run the split entries exist and this step never runs again.
      - name: Restore the pre-split toolchain cache
        if: inputs.fresh_build != true && steps.toolchain-check.outputs.usable != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            morpthis-player/rockbox-toolchain
            morpthis-player/freetype-target
            morpthis-player/audio-target
            morpthis-player/*.tar.gz
            morpthis-player/*.tar.bz2
            morpthis-player/*.tar.xz
          key: v3-mips-target-${{ runner.os }}-morpthis-${{ hashFiles('morpthis-player/Makefile', 'morpthis-player/rockboxdev/**') }}
          restore-keys: |
            v3-mips-target-${{ runner.os }}-morpthis-

      # FreeType and the audio libraries, rebuilt from their pinned tarballs in
      # a few minutes. Apart from the compiler so the reset toggles can throw
      # these away without throwing the compiler away. No restore-keys: the key
      # covers the Makefile's versions and LIB_CFLAGS, so a mismatch means these
      # have to be rebuilt, and a fallback would silently keep stale objects.
      - name: Restore the target libraries
        id: libs-cache
        if: inputs.fresh_build != true && inputs.fresh_keep_toolchain != true
        uses: actions/cache/restore@v5
        with:
          path: |
            morpthis-player/freetype-target
            morpthis-player/audio-target
            morpthis-player/*.tar.gz
            morpthis-player/*.tar.bz2
            morpthis-player/*.tar.xz
          key: v3-mips-libs-${{ runner.os }}-${{ hashFiles('morpthis-player/Makefile') }}${{ env.CACHE_SUFFIX }}

      # LVGL's 483 objects as one archive. The key covers every input the
      # Makefile folds into the archive name -- flags and LVGL version through
      # the Makefile, lv_conf.h, the force-included compat header -- plus the
      # compiler. A hit means the archive is valid for this run, and make never
      # asks for a single LVGL compile. A miss costs exactly what the build did
      # before this cache existed (ccache still covers it), never more.
      - name: Restore the LVGL archive
        id: lvgl-cache
        if: inputs.fresh_build != true && inputs.fresh_keep_toolchain != true
        uses: actions/cache/restore@v5
        with:
          path: morpthis-player/build_target/liblvgl-*.a
          key: lvgl-${{ runner.os }}-${{ hashFiles('morpthis-player/Makefile', 'morpthis-player/lv_conf.h', 'morpthis-player/src/system/core/glibc_compat.h', 'morpthis-player/rockboxdev/**') }}${{ env.CACHE_SUFFIX }}

      # The target objects, through ccache. 483 of the 689 translation units are
      # LVGL and never change between commits; without this every run compiles
      # all of them again. Actions caches are immutable, so the key carries the
      # player and SDK commits and restore-keys take the newest previous entry as
      # the starting point; ccache itself hashes the compiler options and the
      # preprocessed source, so an entry is only reused when it really matches.
      - name: Restore the compiler cache
        id: ccache-cache
        if: inputs.fresh_build != true && inputs.fresh_keep_toolchain != true
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-v1-${{ steps.source.outputs.sha }}-${{ steps.source.outputs.sdk_sha }}${{ env.CACHE_SUFFIX }}
          restore-keys: |
            ccache-${{ runner.os }}-v1-

      - name: Build TempoTec V1 target binaries
        working-directory: morpthis-player
        run: |
          set -euo pipefail
          # A cache miss means rockboxdev.sh builds binutils, gcc, glibc and
          # the rest from scratch, and it sends each tool's make output to
          # tmp/rbdev-build/build-<tool>.log. Without this, the job shows only
          # "ROCKBOXDEV: glibc-2.27/make" for ten minutes and looks hung.
          #
          # Only a miss needs it, so a normal run starts no background process at
          # all. When it does run, the sleep writes to /dev/null: otherwise an
          # interrupted sleep still holds the step's stdout pipe open, and the
          # runner waits for that before it can finish the step.
          if [ ! -x rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc ]; then
            (
              while :; do
                log="$(ls -t tmp/rbdev-build/*.log 2>/dev/null | head -n 1 || true)"
                if [ -n "$log" ]; then
                  echo "--- $log (last 5 lines)"
                  tail -n 5 "$log"
                fi
                sleep 30 </dev/null >/dev/null 2>&1
              done
            ) &
            watcher=$!
            # Kill the sleep as well as the loop: the loop is normally sitting
            # in it when the build ends.
            trap 'pkill -P "$watcher" 2>/dev/null || true; kill "$watcher" 2>/dev/null || true' EXIT
          fi
          # The stats file lives inside the cached CCACHE_DIR, so without this
          # the numbers printed at the end are cumulative across every run that
          # restored the cache. Zero them so the hit rate is this run's.
          ccache --zero-stats >/dev/null || true
          make target -j"$(nproc)" CROSS_CC_LAUNCH=ccache
          ccache --show-stats || true

      # Saved after the build, so a failed build leaves the caches as they were.
      # A restore-keys match counts as a miss (`cache-hit` is false), so the
      # entry is rewritten under the key this run computed. A concurrent run may
      # have written the same key first; that is not a failure.
      - name: Save the MIPS toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: morpthis-player/rockbox-toolchain
          key: v3-mips-toolchain-${{ runner.os }}-${{ hashFiles('morpthis-player/rockboxdev/**') }}${{ env.TOOLCHAIN_CACHE_SUFFIX }}

      - name: Save the target libraries
        if: steps.libs-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            morpthis-player/freetype-target
            morpthis-player/audio-target
            morpthis-player/*.tar.gz
            morpthis-player/*.tar.bz2
            morpthis-player/*.tar.xz
          key: v3-mips-libs-${{ runner.os }}-${{ hashFiles('morpthis-player/Makefile') }}${{ env.CACHE_SUFFIX }}

      - name: Save the LVGL checkout
        if: steps.lvgl-checkout.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: morpthis-player/lvgl
          key: lvgl-src-${{ runner.os }}-${{ steps.lvgl-version.outputs.value }}

      - name: Save the LVGL archive
        if: steps.lvgl-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: morpthis-player/build_target/liblvgl-*.a
          key: lvgl-${{ runner.os }}-${{ hashFiles('morpthis-player/Makefile', 'morpthis-player/lv_conf.h', 'morpthis-player/src/system/core/glibc_compat.h', 'morpthis-player/rockboxdev/**') }}${{ env.CACHE_SUFFIX }}

      - name: Save the compiler cache
        if: steps.ccache-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-v1-${{ steps.source.outputs.sha }}-${{ steps.source.outputs.sdk_sha }}${{ env.CACHE_SUFFIX }}

      - name: Check the exported SDK surface
        env:
          CROSS_NM: ${{ github.workspace }}/morpthis-player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-nm
        run: |
          set -euo pipefail
          sdk_sha="$(git -C morpthis-sdk rev-parse HEAD)"
          echo "check-exports against morpthis-sdk $sdk_sha"
          if ! sh morpthis-sdk/tools/check-exports.sh morpthis-player/morpthis_player; then
            echo "::error::The player exports symbols this morpthis-sdk does not list. If the player needs a newer API, push morpthis-sdk first and re-run, or set sdk_ref to that commit."
            exit 1
          fi

      - name: Build v1.upt
        run: |
          install -m 0755 morpthis-player/morpthis_player morpthis-packer/morpthis_player
          install -m 0755 morpthis-player/morpthis_launch morpthis-packer/morpthis_launch
          morpthis-packer/morpthis_firmware_packer.sh

      - name: Validate generated firmware and unchanged kernel
        run: |
          morpthis-packer/verify_upt.sh morpthis-packer/v1.upt \
            --morpthis-v1 --kernel-sha256 '${{ steps.stock.outputs.kernel_sha256 }}' \
            | tee "$RUNNER_TEMP/v1-output-validation.txt"

      - name: Assemble downloadable artifact
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/morpthis-tempotec-v1"
          mkdir -p "$out"
          # The artifact holds only what a user flashes and the checksum that
          # goes with it.
          cp morpthis-packer/v1.upt morpthis-packer/v1_md5.txt "$out/"
          # What the packer found in the stock boot script and what it put
          # there stays in the run summary rather than in the artifact.
          if [ -f morpthis-packer/boot-script-report.txt ]; then
            { echo "## Boot script patch report"; echo '```'; cat morpthis-packer/boot-script-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          # The commit the image was built from, not the ref the run was
          # started on: this name is what says which of the artifacts in the
          # list holds which tree.
          name: morpthis-tempotec-v1-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/morpthis-tempotec-v1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # A tag is a promise that the image under it was built from the commit
      # that tag names. It is checked and only then kept: a run asked for a
      # release's own commit puts the image on that release, replacing whatever
      # is there -- which is how an image built from a branch that predated a
      # merge gets corrected rather than published as the version it is not.
      - name: Publish the image to its release
        if: github.ref_type == 'tag' || inputs.publish_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ inputs.publish_release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          echo "release $RELEASE_TAG is $tag_sha; this image is $BUILT_SHA"
          if [ "$tag_sha" != "$BUILT_SHA" ]; then
            echo "::error::the image was built from $BUILT_SHA and $RELEASE_TAG names $tag_sha. Nothing was published."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG has no release yet; the artifact above carries the image."
            echo "Create the release, then run this workflow again with publish_release_tag=$RELEASE_TAG."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" morpthis-packer/v1.upt morpthis-packer/v1_md5.txt --clobber
          local_size="$(stat -c%s morpthis-packer/v1.upt)"
          remote_size="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | select(.name == "v1.upt") | .size')"
          [ "$local_size" = "$remote_size" ] || {
            echo "::error::the release holds a $remote_size byte v1.upt and this build made $local_size bytes."
            exit 1
          }
          {
            echo "### Published to release $RELEASE_TAG"
            echo "v1.upt, $local_size bytes, built from $BUILT_SHA."
          } >> "$GITHUB_STEP_SUMMARY"

      # Working branches only: main is not a branch anybody builds as a
      # scratch pad, and a report pushed there would be a commit on main for
      # every merge into it. Nor after a run that built somebody else's ref --
      # its report is that ref's, and this checkout is not where it belongs.
      - name: Publish the boot-script report to the branch
        if: github.ref_type == 'branch' && github.ref_name != 'main' && inputs.build_ref == ''
        run: |
          [ -f morpthis-packer/boot-script-report.txt ] || exit 0
          mkdir -p docs/ci
          cp morpthis-packer/boot-script-report.txt docs/ci/boot-script-report.txt
          git config user.name "morpthis-ci"
          git config user.email "morpthis-ci@users.noreply.github.com"
          git add docs/ci/boot-script-report.txt
          git commit -m "ci: what the packer found in the stock boot script [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "report push skipped (branch busy)"
