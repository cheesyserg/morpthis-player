// Morpthis: classic AirPlay, decoded by shairport-sync and handed to the
// player as raw PCM. The player owns the DAC, so nothing here opens ALSA.
//
// The player reads /tmp/shairport-sync-audio expecting exactly these terms:
// S16_LE, 44100 Hz, stereo. They are the classic AirPlay format as it arrives,
// so no conversion happens anywhere between the phone and the DAC.
general =
{
	name = "Morpthis";
	output_backend = "pipe";

	// The player's hardware volume is the only one that should matter. A
	// sender's slider at 20% would otherwise be applied on top of it.
	ignore_volume_control = "yes";

	// The player's own ring adds ~190 ms and its ALSA buffer 200 ms. A quarter
	// of a second here keeps the whole path close to the old receiver's latency
	// without making a stall in the player audible.
	audio_backend_buffer_desired_length_in_seconds = 0.25;
};

pipe =
{
	name = "/tmp/shairport-sync-audio";
	output_rate = 44100;
	output_format = "S16_LE";
	output_channels = 2;
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "/tmp/shairport-sync-metadata";
};
